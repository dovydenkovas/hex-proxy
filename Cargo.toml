[package]
name = "hex-proxy"
version = "0.1.0"
description = "A tiny, asynchronous TCP reverse proxy daemon"
authors = ["Aleksandr Dovydenkov <asd@altlinux.org>"]
edition = "2024"
license = "GPLv3+"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.54.1", features = ["full"] }
toml = "1.1.8"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
